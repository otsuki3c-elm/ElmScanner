name: ElmScanner
options:
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Signing.xcconfig
  Release: Config/Signing.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_EMIT_LOC_STRINGS: YES
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    STRING_CATALOG_GENERATE_SYMBOLS: NO
targetTemplates:
  MacApp:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ElmScanner
      - path: Resources/Mac
      - path: Resources/Shared
    entitlements:
      path: ElmScanner.entitlements
      properties:
        com.apple.security.device.camera: true
        # No iCloud for now: sending to ElmLibrary is off (LibrarySender.isAvailable). When it
        # ships, add back com.apple.developer.icloud-container-identifiers: [$(CLOUDKIT_CONTAINER)]
        # and com.apple.developer.icloud-services: [CloudKit] here and in ElmScannerPhone.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: ElmScanner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: ElmScanner
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: true
        # App Sandbox, with files picked in open/save panels.
        ENABLE_APP_SANDBOX: true
        ENABLE_USER_SELECTED_FILES: readwrite
        # ISBN lookup (Open Library) and the camera.
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: true
        INFOPLIST_KEY_NSCameraUsageDescription: ElmScanner uses the camera to scan the ISBN barcode on a book, and to say hello if you smile at it.
        # Only ordinary HTTPS and hashing: exempt, so App Store Connect skips the export questions.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
targets:
  ElmScanner:
    templates: [MacApp]
  # The build for direct download (GitHub): no In-App Purchase; the tip is a PayPal link.
  ElmScannerDirect:
    templates: [MacApp]
    # No iCloud here (a direct download has no provisioning profile for it): books aren't sent to ElmLibrary.
    entitlements:
      path: ElmScannerDirect.entitlements
      properties:
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).direct
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DIRECT_DOWNLOAD"
  ElmScannerPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ElmScanner
        excludes:
          # Mac-only screens; the iPhone has its own in Sources/ElmScannerPhone.
          - App/ElmScannerApp.swift
          - Views/ContentView.swift
          - Views/ReviewView.swift
          # The PayPal tip is for the direct-download Mac build only.
          - Views/PayPalTipSection.swift
      - path: Sources/ElmScannerPhone
      - path: Resources/Phone
      - path: Resources/Shared
    # No iCloud entitlement for now (see the Mac template above).
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: ElmScanner
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: ElmScanner
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: ElmScanner uses the camera to scan the ISBN barcode on a book, and to say hello if you smile at it.
        # Only ordinary HTTPS and hashing: exempt, so App Store Connect skips the export questions.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
  ElmScannerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/ElmScannerTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: ElmScanner
      - sdk: StoreKitTest.framework
schemes:
  ElmScannerPhone:
    build:
      targets:
        ElmScannerPhone: all
    run:
      config: Debug
      # Lets "Leave a tip" be tried in Xcode without App Store Connect (product ID = bundle ID + ".tip").
      storeKitConfiguration: Config/ElmScanner.storekit
    archive:
      config: Release
  ElmScanner:
    build:
      targets:
        ElmScanner: all
        ElmScannerTests: [test]
    test:
      config: Debug
      targets:
        - ElmScannerTests
    run:
      config: Debug
      storeKitConfiguration: Config/ElmScanner.storekit
    archive:
      config: Release
  ElmScannerDirect:
    build:
      targets:
        ElmScannerDirect: all
    run:
      config: Debug
    archive:
      config: Release
