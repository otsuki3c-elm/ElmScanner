name: ElmScanner
options:
  bundleIdPrefix: com.otsuki.elmscanner
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  ElmScanner:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Sources/ElmScanner
      - path: Resources/Mac
      - path: Resources/Shared
    entitlements:
      path: ElmScanner.entitlements
      properties:
        com.apple.security.device.camera: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.otsuki.elmscanner.ElmScanner
        PRODUCT_NAME: ElmScanner
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: ElmScanner
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: true
        # App Sandbox, with files picked in open/save panels.
        ENABLE_APP_SANDBOX: true
        ENABLE_USER_SELECTED_FILES: readwrite
        # ISBN lookup (Open Library) and the camera.
        ENABLE_OUTGOING_NETWORK_CONNECTIONS: true
        INFOPLIST_KEY_NSCameraUsageDescription: ElmScanner uses the camera to scan the ISBN barcode on a book.
        # Only ordinary HTTPS and hashing: exempt, so App Store Connect skips the export questions.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
  ElmScannerPhone:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/ElmScanner
        excludes:
          # Mac-only screens; the iPhone has its own in Sources/ElmScannerPhone.
          - App/ElmScannerApp.swift
          - Views/ContentView.swift
          - Views/ReviewView.swift
      - path: Sources/ElmScannerPhone
      - path: Resources/Phone
      - path: Resources/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.otsuki.elmscanner.ElmScanner
        PRODUCT_NAME: ElmScanner
        TARGETED_DEVICE_FAMILY: "1"
        DEVELOPMENT_TEAM: 3SW5MDWRVL
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_CFBundleDisplayName: ElmScanner
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: ElmScanner uses the camera to scan the ISBN barcode on a book.
        # Only ordinary HTTPS and hashing: exempt, so App Store Connect skips the export questions.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: false
  ElmScannerTests:
    type: bundle.unit-test
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Tests/ElmScannerTests
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
    dependencies:
      - target: ElmScanner
schemes:
  ElmScannerPhone:
    build:
      targets:
        ElmScannerPhone: all
    run:
      config: Debug
    archive:
      config: Release
  ElmScanner:
    build:
      targets:
        ElmScanner: all
        ElmScannerTests: [test]
    test:
      config: Debug
      targets:
        - ElmScannerTests
    run:
      config: Debug
    archive:
      config: Release
